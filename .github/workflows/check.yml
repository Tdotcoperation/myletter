name: Check MyLetter
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - name: Smoke-test real Wrangler D1 and R2 runtime
        shell: bash
        run: |
          set -e
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 > /tmp/myletter-wrangler.log 2>&1 &
          echo $! > /tmp/myletter-wrangler.pid
          trap 'cat /tmp/myletter-wrangler.log; kill $(cat /tmp/myletter-wrangler.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 2
          done
          node tests/smoke.mjs

  remote-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live custom domain without modifying production data
        shell: bash
        run: |
          for endpoint in /api/health /api/diagnostics; do
            echo "== $endpoint ==";
            curl --max-time 12 -sS -w '\nHTTP %{http_code}\n' "https://myletter.imtdot.kr$endpoint" || true;
            echo;
          done
      - name: Live issuance smoke test (temporary test letters cleaned up)
        run: node tests/live-smoke.mjs
